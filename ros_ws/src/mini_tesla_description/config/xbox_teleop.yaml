# Xbox controller -> /cmd_vel for the holonomic 10C4I (joy + scripts/xbox_teleop.py, ROS 2 Jazzy).
# Axis/button numbers are the Linux xpad/xone layout (Xbox One / Series pad, USB or Bluetooth):
#   axes    0 left stick X (left +)   1 left stick Y (up +)   2 LT   3 right stick X (left +)   5 RT
#   buttons 4 LB
# Hold LB to drive (dead-man switch). RT raises and LT lowers the speed limit while held.
joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.1
    autorepeat_rate: 20.0

xbox_teleop:
  ros__parameters:
    axis_forward: 1
    axis_strafe: 0
    axis_yaw: 3
    axis_lt: 2
    axis_rt: 5
    enable_button: 4
    max_linear: 1.2        # m/s at 100 % speed
    max_angular: 2.5       # rad/s at 100 % speed
    min_speed: 0.1         # lowest speed limit (fraction)
    initial_speed: 0.4     # starting speed limit (fraction)
    speed_rate: 0.5        # speed fraction per second with a trigger fully pressed
